enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 7d

packageExtensions:
  # astro2tsx (used by `astro check`) loads @napi-rs/wasm-runtime without providing its
  # @emnapi peers, so the import fails and astro check offers to install @astrojs/check.
  '@astrojs/astro2tsx@*':
    dependencies:
      '@emnapi/core': ^1.7.1
      '@emnapi/runtime': ^1.7.1
